<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Instituto Magna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">
    <header class="bg-blue-950 text-white border-b-4 border-amber-500 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="./index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-amber-500 rounded flex items-center justify-center font-serif font-bold text-blue-950 text-xl shadow">IM</div>
                <h1 class="font-serif text-xl md:text-2xl font-bold tracking-wide">Instituto Magna</h1>
            </a>
            <a href="./index.html" class="text-sm px-3 py-2 rounded hover:bg-blue-900 hover:text-pink-400 transition">← Voltar ao site</a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-10 sm:py-16 bg-gradient-to-br from-blue-950 via-blue-900 to-pink-950">
        <div class="w-full max-w-md bg-white rounded-lg shadow-xl border-t-4 border-pink-600 p-5 sm:p-8">
            <h2 class="font-serif text-3xl font-bold text-blue-950 mb-1">Portal do Aluno</h2>
            <p class="text-slate-500 text-sm mb-6">Acesse sua conta acadêmica.</p>

            <form id="loginForm" class="space-y-4" novalidate>
                <div>
                    <label for="userInput" class="block text-sm font-medium text-slate-700 mb-1">Usuário</label>
                    <input id="userInput" name="userInput" type="text" autocomplete="username" required
                           class="w-full border border-slate-300 rounded px-3 py-3 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                </div>
                <div>
                    <label for="passwordInput" class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                    <input id="passwordInput" name="passwordInput" type="password" autocomplete="current-password" required
                           class="w-full border border-slate-300 rounded px-3 py-3 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                </div>
                <p id="errorMessage" class="text-pink-600 text-sm hidden font-medium" role="alert"></p>
                <button type="submit" class="w-full bg-blue-950 hover:bg-blue-900 text-amber-400 font-semibold py-3 rounded shadow transition">
                    Entrar no Portal
                </button>
            </form>
        </div>
    </main>

    <script type="module" src="./assets/login.js"></script>
</body>
</html>
